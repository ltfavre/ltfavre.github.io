id: BASC4_NB
display_name: BASC-4 Narrowbands
version: "1.3"
status: Validated
runnable: true
capabilities:
  recruitment_planning: true
  sample_optimization: true
  targeted_swap: true

data_specification:
  mapping_resource: mappings/variable_map.yaml
  variable_map:
    teid: teid
    form: vform
    age: agey
    age_group: agegrp
    sex: sex
    ethnicity: eth
    education: edl
    region: region
    language: testlang
    study_type: study
  id_variable: teid
  forms: [TRS_C, TRS_A, PRS_C, PRS_A, SRP_C, SRP_A]
  age_structure: [Child, Adolescent]
  languages: [English, Spanish]
  study_types: [STDZ, Clinical, Validity]
  demographics: [sex, eth, edl, region]
  missing_value_codes: ["", NA, N/A, Missing, 999]
  test_ids: []
  reporting_variables:
    Age:
      canonical: age_group
      field: agegrp
      display: Age Group
      levels: [3, 4, 5, 6]
    Sex:
      canonical: sex
      field: sex
      display: Sex
      levels:
        - {value: F, label: Female}
        - {value: M, label: Male}
    Ethnicity:
      canonical: ethnicity
      field: eth
      display: Race/Ethnicity
      levels:
        - {value: AS, label: Asian}
        - {value: BL, label: Black/African American}
        - {value: HI, label: Hispanic/Latino}
        - {value: OT, label: Other}
        - {value: WH, label: White}
    Education:
      canonical: education
      field: edl
      display: Education
      levels: ["1", "2", "3", "4"]
    Region:
      canonical: region
      field: region
      display: Region
      levels:
        - {value: MW, label: Midwest}
        - {value: NE, label: Northeast}
        - {value: SO, label: South}
        - {value: WE, label: West}
  administration_rules:
    first_administration_only: true
    exclude_retests: true
    exclude_other_raters: true
  osep_mappings:
    flags: [tmp_ADHD, tmp_EBD, tmp_ASD, tmp_DD, tmp_SLD, tmp_SLI]
  clinical_mappings:
    flags: [tmp_clin]

sampling_specification:
  engine_config: basc4_adhd
  duplicate_resolution: source_priority
  default_target_n: 2400
  target_families: [Census, OSEP, Clinical]
  target_flags: [tmp_ADHD, tmp_EBD, tmp_ASD, tmp_DD, tmp_SLD, tmp_SLI, tmp_clin]
  eligibility_rules:
    - Standardization administrations only
    - Retests and other-rater records excluded
    - Form and age eligibility enforced
  default_locks: [vform, agegrp]
  current_sample_required_for_first_run: false
  current_sample_use: Re-optimization only
  seeding_rules:
    clinical_osep_seeding_supported: true
    cross_coding_requires_profile_mapping: true
  priorities_and_tolerances: specifications/sampling_and_reporting.yaml

reporting_specification:
  recruitment_template: profiles/BASC4_NB/templates/recruitment/recruitment_report_template.xlsx
  optimization_template: profiles/_shared/templates/SCOPE_Demographic_Table_Templates.xlsx
  targeted_swap_template: profiles/BASC4_NB/templates/targeted_swap/swap_output_template.xlsx
  required_tables:
    demographics: [Age, Sex, Ethnicity, Education, Region]
    demo_cross_tabs:
      - Age × Sex
      - Age × Ethnicity
      - Age × Education
      - Age × Region
      - Sex × Ethnicity
      - Sex × Education
      - Sex × Region
      - Ethnicity × Education
      - Ethnicity × Region
      - Education × Region
    osep: [OSEP Summary]
    clinical: [Clinical Summary]
    recruitment: [Field Research Report, Recruitment Targets]
    qa: [Constraint Summary, Run Manifest]
  comparison_columns: [Target %, Selected %, Diff]
  diff_formula: Selected % - Target %
  negative_diff_format: red font and pale-red fill

output_specification:
  required_resources:
    - research_specification
    - census_targets
    - osep_specification
    - recruitment_targets
    - recruitment_template
    - demographic_template
    - osep_template
    - clinical_template
    - targeted_swap_template
    - profile_validation
  project_run_layout: true
  workflow_deliverables:
    recruitment_planning:
      - Recruitment/Field_Research_Report.xlsx
      - Recruitment/Recruitment_Targets.xlsx
      - run_manifest.json
    sample_optimization:
      - Cases/Selected_TEIDs.xlsx
      - Cases/Available_Pool.xlsx
      - Stratification/Demographic_Tables.xlsx
      - Stratification/OSEP_Tables.xlsx
      - Stratification/Clinical_Tables.xlsx
      - QA/Constraint_Summary.xlsx
      - run_manifest.json
    targeted_swap:
      - Cases/Selected_TEIDs.xlsx
      - Cases/Available_Pool.xlsx
      - QA/Swap_Log.xlsx
      - Stratification/Updated_Stratification.xlsx
      - run_manifest.json

resources:
  research_specification: specifications/sampling_and_reporting.yaml
  census_targets: specifications/approved_targets.xlsx
  osep_specification: specifications/sampling_and_reporting.yaml
  approved_targets: specifications/approved_targets.xlsx
  recruitment_targets: specifications/recruitment_targets.csv
  recruitment_template: templates/recruitment/recruitment_report_template.xlsx
  demographic_template: profiles/_shared/templates/SCOPE_Demographic_Table_Templates.xlsx
  osep_template: templates/optimization/osep_tables_template.xlsx
  clinical_template: templates/optimization/clinical_tables_template.xlsx
  targeted_swap_template: templates/targeted_swap/swap_output_template.xlsx
  profile_validation: validation/profile_validation.yaml

workflow_inputs:
  sample_optimization:
    - role: master_dataset
      group: CASE DATA
      label: Master / STDZ dataset
      status: required
      kind: file
      accepted_types: [.xlsx, .xls, .csv, .sas7bdat]
      purpose: Complete current BASC project participant universe.
      adapter: basc_case_universe
    - role: scored_data
      group: CASE DATA
      label: Scored-data folder
      status: required
      kind: folder
      accepted_types: [.sas7bdat]
      purpose: Current scored form, eligibility, demographic, and candidate records.
      adapter: basc_scored_directory
    - role: initial_teid_source
      group: CASE DATA
      label: All Cases / TEID source
      status: optional
      kind: file
      accepted_types: [.xlsx, .xlsm, .csv]
      purpose: Optional current-project membership source when it is not encoded in the master dataset.
      adapter: basc_initial_teids
    - role: current_sample
      group: SAMPLE
      label: Existing selected sample
      status: optional
      kind: file
      accepted_types: [.xlsx, .xlsm]
      purpose: Use only for intentional re-optimization.
      adapter: basc_current_sample
    - role: target_specification
      group: PROJECT OVERRIDES
      label: Project-specific target override
      status: optional
      kind: file
      accepted_types: [.xlsx, .xlsm, .csv, .json]
      purpose: Explicitly overrides the approved targets bundled with this profile.
      adapter: basc_target_workbook
    - role: case_review_data
      group: PROJECT OVERRIDES
      label: Prior case-review folder
      status: optional
      kind: folder
      accepted_types: [.xlsx]
      purpose: Optional approved project-specific case-review information.
      adapter: basc_case_review
  recruitment_planning:
    - role: recruitment_targets
      group: PROJECT OVERRIDES
      label: Project-specific target amendment
      status: optional
      kind: file
      accepted_types: [.xlsx, .csv]
      purpose: Optional amendment; otherwise SCOPE uses the approved profile recruitment specification.
      adapter: scope_recruitment_targets
    - role: recruitment_progress
      group: PROJECT DATA
      label: Current recruitment / progress report
      status: optional
      kind: file
      accepted_types: [.xlsx, .csv]
      purpose: Current recruited or usable counts.
      adapter: scope_recruitment_progress
  targeted_swap:
    - role: swap_sample
      group: SAMPLE
      label: Existing SCOPE-selected sample
      status: required
      kind: file
      accepted_types: [.xlsx]
      purpose: Current selected sample to update without rerunning CP-SAT.
      adapter: canonical_sample
    - role: swap_available_pool
      group: CASE DATA
      label: Candidate / available pool
      status: required
      kind: file
      accepted_types: [.xlsx]
      purpose: Current eligible replacement pool.
      adapter: canonical_pool
